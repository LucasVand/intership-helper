name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on:
      - self-hosted
    environment:
      name: production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Start database
        run: docker compose --env-file /opt/intership-helper/.env.production up -d db

      - name: Run database migrations
        run: docker compose --env-file /opt/intership-helper/.env.production run --build --rm migrate

      - name: Sync internship data
        run: docker compose --env-file /opt/intership-helper/.env.production run --build --rm sync

      - name: Show database logs after migration failure
        if: failure()
        run: docker compose --env-file /opt/intership-helper/.env.production logs --no-color db

      - name: Build and start application
        run: docker compose --env-file /opt/intership-helper/.env.production up -d --build app

      - name: Check application health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file /opt/intership-helper/.env.production logs app
          exit 1

      - name: Remove unused images
        run: docker image prune -f
